x-runner-common: &runner-common
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  expose:
    - "8090"
  volumes:
    - benchmark-results:/results
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
    interval: 10s
    timeout: 3s
    retries: 10

services:
  dashboard-ui:
    build:
      context: ./apps/ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      dashboard-api:
        condition: service_healthy

  dashboard-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      BENCHMARK_RESULTS_ROOT: /results
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - benchmark-results:/results:ro
    depends_on:
      context-rag-runner:
        condition: service_healthy
      graph-rag-runner:
        condition: service_healthy
      hybrid-rag-runner:
        condition: service_healthy
      knowledge-enhanced-rag-runner:
        condition: service_healthy
      memory-augmented-rag-runner:
        condition: service_healthy
      self-rag-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  context-rag-runner:
    <<: *runner-common
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        RAG_NAME: context-rag
    environment:
      RAG_NAME: context-rag
      BENCHMARK_OUTPUT_DIR: /results/context-rag
      CHROMA_PERSIST_DIR: /cache/context-rag/chroma
    volumes:
      - benchmark-results:/results
      - rag-cache:/cache
      - ./rags/context-rag/docs:/workspace/rags/context-rag/docs:ro

  graph-rag-runner:
    <<: *runner-common
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        RAG_NAME: graph-rag
    environment:
      RAG_NAME: graph-rag
      BENCHMARK_OUTPUT_DIR: /results/graph-rag
      CHROMA_PERSIST_DIR: /cache/graph-rag/chroma
    volumes:
      - benchmark-results:/results
      - rag-cache:/cache
      - ./rags/graph-rag/docs:/workspace/rags/graph-rag/docs:ro

  hybrid-rag-runner:
    <<: *runner-common
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        RAG_NAME: hybrid-rag
    environment:
      RAG_NAME: hybrid-rag
      BENCHMARK_OUTPUT_DIR: /results/hybrid-rag
      CHROMA_PERSIST_DIR: /cache/hybrid-rag/chroma
    volumes:
      - benchmark-results:/results
      - rag-cache:/cache
      - ./rags/hybrid-rag/docs:/workspace/rags/hybrid-rag/docs:ro

  knowledge-enhanced-rag-runner:
    <<: *runner-common
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        RAG_NAME: knowledge-enhanced-rag
    environment:
      RAG_NAME: knowledge-enhanced-rag
      BENCHMARK_OUTPUT_DIR: /results/knowledge-enhanced-rag
      CHROMA_PERSIST_DIR: /cache/knowledge-enhanced-rag/chroma
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-benchmarking-rags}
    volumes:
      - benchmark-results:/results
      - rag-cache:/cache
      - ./rags/knowledge-enhanced-rag/data/apostilas:/workspace/rags/knowledge-enhanced-rag/data/apostilas:ro
    depends_on:
      neo4j:
        condition: service_healthy

  memory-augmented-rag-runner:
    <<: *runner-common
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        RAG_NAME: memory-augmented-rag
    environment:
      RAG_NAME: memory-augmented-rag
      BENCHMARK_OUTPUT_DIR: /results/memory-augmented-rag
      CHROMA_PERSIST_DIR: /cache/memory-augmented-rag/chroma
    volumes:
      - benchmark-results:/results
      - rag-cache:/cache
      - ./rags/memory-augmented-rag/docs:/workspace/rags/memory-augmented-rag/docs:ro

  self-rag-runner:
    <<: *runner-common
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        RAG_NAME: self-rag
    environment:
      RAG_NAME: self-rag
      BENCHMARK_OUTPUT_DIR: /results/self-rag
      CHROMA_PERSIST_DIR: /cache/self-rag/chroma
    volumes:
      - benchmark-results:/results
      - rag-cache:/cache
      - ./rags/self-rag/docs:/workspace/rags/self-rag/docs:ro

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-benchmarking-rags}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-benchmarking-rags} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  benchmark-results:
  rag-cache:
  neo4j-data:
