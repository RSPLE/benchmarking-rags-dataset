[project]
name = "rag-benchmark-dashboard"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.50,<2",
    "matplotlib>=3.10,<3.11",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "starlette>=1.0,<2",
    "uvicorn>=0.40,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["httpx2"]
