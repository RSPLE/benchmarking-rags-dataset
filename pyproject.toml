[project]
name = "benchmarking-rags-dataset"
version = "0.1.0"
description = "Orchestrator for isolated, resumable RAG benchmarks"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv>=1.0",
    "uv>=0.12.5",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
